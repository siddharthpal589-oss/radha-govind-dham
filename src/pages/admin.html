.<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radha Govind Dham Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

h1{
text-align:center;
color:#fbbf24;
margin-bottom:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,.3);
}

.card h2{
font-size:40px;
color:#fbbf24;
margin-bottom:10px;
}

.section{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-top:30px;
}

.section h2{
margin-bottom:15px;
color:#fbbf24;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:16px;
}

button{
margin-top:15px;
padding:12px 20px;
background:#fbbf24;
color:black;
font-weight:bold;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#f59e0b;
}

</style>

</head>

<body>

<h1>🛕 Radha Govind Dham Admin Panel</h1>

<div class="cards">

<div class="card">
<h2>24</h2>
<p>Gallery Images</p>
</div>

<div class="card">
<h2>2</h2>
<p>Events</p>
</div>

<div class="card">
<h2>18</h2>
<p>Messages</p>
</div>

</div><div class="section">

<h2>📷 Upload New Image</h2>

<input type="file" id="image">

<button>Upload Image</button>

</div>

<div class="section">

<h2>📢 Add Announcement</h2>

<textarea id="announcement" rows="5"></textarea>

<button id="publishBtn">Publish</button>
<script type="module" src="./
admin.ts"></script>
</div></body>
</html>
